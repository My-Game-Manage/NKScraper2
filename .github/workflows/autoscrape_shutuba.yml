name: Scheduled Horse Racing Scraping

on:
  schedule:
#    - cron: '0 8 * * *' # 日本時間19:00：翌日の出馬表(fetch_data.py)を取得
    - cron: '0 18 * * *' # 日本時間3:00：当日の出馬表(fetch_data.py)を取得
  workflow_dispatch: # 手動実行ボタンも残しておく

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # pipのキャッシュを有効にして高速化
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps
          
      # 出馬表取得（翌日分）
      - name: Fetch Tomorrow's Race Data
        run: |
          python main.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git commit -m "Update race shutuba data $(date +%Y-%m-%d)" || exit 0
          git push